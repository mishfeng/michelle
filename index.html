<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michelle Feng</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap');

  :root {
    --ink: #1a1a1a;
    --gray: #6b6b6b;
    --bg: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'SF Pro Round', -apple-system, BlinkMacSystemFont, sans-serif;
  display: flex;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  text-align: left;
  padding: 6vh 8vw;
}

  main {
    max-width: 640px;
  }

  h1 {
    font-size: clamp(2.2rem, 5vw, 3.2rem);
    font-weight: 700;
    margin: 0 0 0.5rem 0;
    letter-spacing: -0.01em;
  }

  .tagline {
    font-size: 1.25rem;
    font-weight: 400;
    margin: 0;
    line-height: 1.4;
  }

  .prev {
    font-style: italic;
    font-weight: 400;
    color: var(--gray);
    font-size: 1.15rem;
    margin: 0 0 1.6rem 0;
  }

  .status {
    color: var(--gray);
    font-size: 1.1rem;
    line-height: 1.6;
    margin: 0 0 1.6rem 0;
  }

  a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  a:hover {
    color: var(--gray);
  }

  a:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  .links {
    display: flex;
    gap: 1.6rem;
    font-size: 1.1rem;
    font-weight: 500;
  }

  @media (max-width: 480px) {
    body { padding: 8vh 6vw; }
    .links { gap: 1.2rem; flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <main>
    <h1>Michelle Feng</h1>
    <p class="tagline">I'm a product designer pursuing whimsical play</p>
    <p class="prev">prev. capital one</p>
    <p class="status">
      Currently rebuilding my portfolio... in the meanwhile, 
      come say hi on <a href="https://www.linkedin.com/in/missmichfeng/" target="_blank" rel="noopener">linkedin</a> or check out my <a href="https://davisdesigninteractive.medium.com/planit-a-ux-case-study-a0be002c6600" target="_blank" rel="noopener">work</a>!
    </p>
    </nav>
  </main>
</body>
</html>
